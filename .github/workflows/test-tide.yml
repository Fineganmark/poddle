name: Test tide gauge fetch (temporary)
on:
  push:
    branches: [faster-pictures-and-polish]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_levels.py /tmp/levels.json && python -c "import json;d=json.load(open('/tmp/levels.json'));[print(s['name'],len(s['points']),s['points'][:2],s['points'][-1]) for s in d['stations']]"
      - run: cat /tmp/levels.json
